name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Syntax-check all source modules
        run: |
          for f in src/*.mjs; do
            node --check "$f"
          done

      - name: Run tests
        run: pnpm test

      - name: Smoke build against example docs
        run: |
          node src/md2html.mjs ./examples/docs "$RUNNER_TEMP/example-site.html" --name "CI Smoke Test"
          test -s "$RUNNER_TEMP/example-site.html"
          grep -q "CI Smoke Test" "$RUNNER_TEMP/example-site.html"

      - name: CLI help exits cleanly
        run: node src/md2html.mjs --help
